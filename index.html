<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>戦闘ゲーム用 特殊能力コマンド生成ツール</title>
<style>
    /* ゲーム本体(SE戦闘ゲームII)と同じ、ラベンダーと白をベースにした配色 */
    :root{
      --lav:#c78fe3;--gray:#585858;
      --bg:#faf6fe;--panel:#ffffff;--ink:#3b3542;--dim:#8a8296;--line:#eadff5;
      --accent:#9b57c9;--accent2:#8a4fb8;--on-accent:#fff;--btn1:#b476dc;--btn2:#9b57c9;
      --chip:#f4ebfb;--good:#1f9c78;
      --shadow:0 6px 24px rgba(155,87,201,.12);--shadow-sm:0 2px 8px rgba(155,87,201,.10);
      --disp:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
      --latin:"Jost","Futura","Century Gothic","Avenir Next",sans-serif;
    }
    @media(prefers-color-scheme:dark){:root{
      --bg:#1b1623;--panel:#251e31;--ink:#f0eaf6;--dim:#aaa0ba;--line:#3b3150;
      --accent:#d6a9f0;--accent2:#c995e8;--on-accent:#2a1740;--btn1:#d6a9f0;--btn2:#c78fe3;
      --gray:#c9c1d4;--chip:#31283f;--good:#5fd4ae;
      --shadow:0 6px 24px rgba(0,0,0,.35);--shadow-sm:0 2px 8px rgba(0,0,0,.3);}}
    *{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--lav) transparent}
    [hidden]{display:none!important}
    html,body{margin:0}
    ::selection{background:#e6cdf5;color:#3b3542}
    :focus-visible{outline:2px solid var(--lav);outline-offset:2px}
    body{
      background:
        radial-gradient(900px 520px at 108% -8%,rgba(199,143,227,.24),transparent 62%),
        radial-gradient(700px 440px at -12% 24%,rgba(199,143,227,.13),transparent 62%),
        var(--bg);
      background-attachment:fixed;
      color:var(--ink);
      font:14px/1.6 "Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI",system-ui,-apple-system,sans-serif;
      padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
    }
    /* ロゴの輪をモチーフにした背景の飾り */
    body::before,body::after{content:"";position:fixed;border-radius:50%;pointer-events:none;z-index:0}
    body::before{right:-130px;bottom:-130px;width:400px;height:400px;border:46px solid var(--lav);opacity:.10}
    body::after{left:-46px;bottom:90px;width:150px;height:150px;border:24px solid var(--gray);opacity:.045}

    /* ヘッダ */
    .top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--panel) 86%,transparent);
      -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
      padding:10px 0 12px;padding-top:max(10px,env(safe-area-inset-top,0px));box-shadow:0 6px 22px rgba(155,87,201,.10)}
    .top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--lav),#ecd9f8 50%,var(--lav))}
    .top .in{max-width:820px;margin:0 auto;padding:0 14px}
    .brand{display:flex;align-items:center;gap:12px}
    .brand .logo{width:46px;height:46px;flex:none}
    .brand .tt{display:flex;flex-direction:column;line-height:1.15;min-width:0}
    .brand h1{font-family:var(--disp);font-size:21px;font-weight:900;letter-spacing:.05em;margin:0}
    .brand .wm{font-family:var(--latin);font-size:10.5px;font-weight:500;letter-spacing:.36em;color:var(--dim);margin-top:3px}

    .wrap{max-width:820px;margin:0 auto;padding:6px 14px 48px;position:relative;z-index:1}
    h2{font-family:var(--disp);font-size:15px;font-weight:700;margin:22px 0 8px;display:flex;align-items:center;gap:8px}
    h2::before{content:"";width:13px;height:13px;border:3.5px solid var(--lav);border-radius:50%;flex:none}

    .form-group{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:6px 18px;box-shadow:var(--shadow)}
    .field{display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px;padding:10px 0;border-bottom:1px dashed var(--line)}
    .field:last-child{border-bottom:none}
    .field label{flex:0 0 220px;font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:8px}
    .field label .ix{font-family:var(--latin);font-size:11px;font-weight:500;letter-spacing:.06em;color:var(--accent2);
      background:var(--chip);border-radius:999px;padding:1px 9px;flex:none}
    select,input[type=number],input[type=text]{
      font:inherit;color:inherit;padding:7px 13px;border:1px solid var(--line);border-radius:12px;background:var(--panel);
      transition:border-color .15s,box-shadow .15s}
    select:hover,input:hover:not(:disabled){border-color:var(--lav)}
    select:focus,input:focus{outline:none;border-color:var(--lav);box-shadow:0 0 0 3px rgba(199,143,227,.28)}
    .field select,.field input[type=number],.field input[type=text]{flex:1 1 200px;min-width:0;max-width:360px}
    .field input.custom-num{flex:0 0 100px}
    input:disabled{background:var(--chip);color:var(--dim)}
    #type{font-weight:700}

    .btn-container{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:10px;margin:22px 0 6px}
    button{font:inherit;font-weight:700;padding:8px 22px;border:1px solid var(--line);background:var(--panel);color:var(--ink);
      border-radius:999px;cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s,filter .12s}
    button:hover{border-color:var(--lav);color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
    button.primary{background:linear-gradient(135deg,var(--btn1),var(--btn2));border-color:transparent;color:var(--on-accent);
      box-shadow:0 3px 10px rgba(155,87,201,.28)}
    button.primary:hover{color:var(--on-accent);border-color:transparent;filter:brightness(1.07)}
    .copied-msg{color:var(--good);font-size:13px;font-weight:700;opacity:0;transition:opacity .2s}
    .copied-msg.show{opacity:1}

    .result-box{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:14px 18px;box-shadow:var(--shadow);margin-bottom:12px}
    .result-box .lbl,.description-box .lbl{display:block;font-size:12px;font-weight:700;color:var(--accent2);letter-spacing:.08em;margin-bottom:6px}
    #output{display:block;background:var(--chip);border-radius:14px;padding:10px 14px;
      font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:1.1em;font-weight:700;
      word-break:break-all;user-select:all}
    .description-box{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--lav);border-radius:22px;
      padding:14px 18px;box-shadow:var(--shadow);font-size:15px;line-height:1.7}

    @media(max-width:560px){
      .brand .logo{width:38px;height:38px}.brand h1{font-size:18px}
      .form-group{padding:4px 14px;border-radius:18px}
      .field label{flex-basis:100%}
      .field select,.field input[type=number],.field input[type=text]{max-width:none}
    }
</style>
</head>
<body>
<header class="top"><div class="in">
  <div class="brand"><svg class="logo" viewBox="225 195 675 665" role="img" aria-label="SE CHARACTERS"><path d="M605.4 241.4A290 290 0 1 0 829.6 620" fill="none" stroke="#c78fe3" stroke-width="55"/><circle cx="738" cy="427" r="118" fill="none" style="stroke:var(--gray)" stroke-width="56"/></svg><div class="tt"><h1>戦闘コマンド生成＆説明ツール</h1><span class="wm">SE CHARACTERS</span></div></div>
</div></header>

<main class="wrap">
  <h2>コマンドの種別</h2>
  <div class="form-group">
    <div class="field">
      <label for="type">種別</label>
      <select id="type" onchange="renderForm()">
        <option value="1">1:能力調整</option>
        <option value="2">2:攻撃</option>
        <option value="3">3:システム介入</option>
        <option value="4">4:条件分岐</option>
      </select>
    </div>
  </div>

  <h2>設定項目</h2>
  <div class="form-group" id="form-fields"></div>

  <div class="btn-container">
    <button class="primary" onclick="generateAll()">コマンド生成</button>
    <button onclick="copyToClipboard()">コピー</button>
    <span id="copy-msg" class="copied-msg">コピーしました！</span>
  </div>

  <h2>生成結果</h2>
  <div class="result-box">
    <span class="lbl">コマンド(ゲームの「特殊能力コマンド」欄にそのまま貼り付け)</span>
    <span id="output">[1 0 0 0 0 0 0 100 0 0 0 0]</span>
  </div>

  <div class="description-box">
    <span class="lbl">能力説明文</span>
    <span id="description">自分の体力を 0 加算する。メーター満タン時に100%の確率で永続的に発動。</span>
  </div>
</main>

<script>
    const specData = {
      1: {
        idx1: { name: "対象", options: ["0:自分", "1:相手", "2:両方"] },
        idx2: { name: "対象ステータス", options: ["0:体力", "1:パワー", "2:ガード", "3:コミュ力", "4:学力", "5:IQ", "6:全ステータス"] },
        idx3: { name: "効果", options: ["0:加算", "1:減算", "2:乗算", "3:除算", "4:相手参照"] },
        idx4: { name: "参照ステータス", options: ["0:体力", "1:パワー", "2:ガード", "3:コミュ力", "4:学力", "5:IQ", "6:前ターンのダメージ量"], dependsOn: { idx: 3, val: ["4"] } },
        idx5: { name: "計算方法", options: ["0:加算", "1:減算", "2:乗算", "3:除算"], dependsOn: { idx: 3, val: ["4"] } },
        idx6: { name: "値レベル", type: "number" },
        idx7: { name: "発動確率(0~100)", type: "number", min: 0, max: 100 },
        idx8: { name: "発動条件", options: ["0:メーター満タン時", "1:永続", "2:HPに応じる"] },
        idx9: { name: "HP取得対象", options: ["0:自分", "1:相手"], dependsOn: { idx: 8, val: ["2"] } },
        idx10: { name: "HP残率指定", type: "number", min: 0, max: 100, dependsOn: { idx: 8, val: ["2"] } },
        idx11: { name: "継続ターン数", type: "custom_turn" }
      },
      2: {
        idx1: { name: "対象", options: ["0:自分(自滅)", "1:相手(攻撃)", "2:両方"] },
        idx2: { name: "対象ステータス", options: ["0:体力"] },
        idx3: { name: "効果", options: ["0:加算(固定値)", "1:乗算(パワー依存)", "2:相手参照"] },
        idx4: { name: "参照ステータス", options: ["0:最大体力", "1:パワー", "2:ガード", "3:コミュ力", "4:学力", "5:IQ", "6:前ターンのダメージ量", "7:実行時の体力"], dependsOn: { idx: 3, val: ["2"] } },
        idx5: { name: "計算方法", options: ["0:加算", "1:減算", "2:乗算", "3:除算"], dependsOn: { idx: 3, val: ["2"] } },
        idx6: { name: "値レベル", type: "number" },
        idx7: { name: "発動確率(0~100)", type: "number", min: 0, max: 100 },
        idx8: { name: "発動条件", options: ["0:メーター満タン時", "1:永続", "2:HPに応じる"] },
        idx9: { name: "HP取得対象", options: ["0:自分", "1:相手"], dependsOn: { idx: 8, val: ["2"] } },
        idx10: { name: "HP残率指定", type: "number", min: 0, max: 100, dependsOn: { idx: 8, val: ["2"] } },
        idx11: { name: "継続ターン数", type: "custom_turn" }
      },
      3: {
        idx1: { name: "対象", options: ["0:自分", "1:相手", "2:両方"] },
        idx2: { name: "活用するシステム", options: ["0:防御力", "1:クリティカル率", "2:ミス率", "3:クリティカル倍率", "4:実行時の体力"] },
        idx3: { name: "効果", options: ["0:加算(固定値)", "1:減算", "2:乗算", "3:除算", "4:相手参照"] },
        idx4: { name: "参照ステータス", options: ["0:最大体力", "1:パワー", "2:ガード", "3:コミュ力", "4:学力", "5:IQ", "6:前ターンのダメージ量", "7:実行時の体力"], dependsOn: { idx: 3, val: ["4"] } },
        idx5: { name: "計算方法", options: ["0:加算", "1:減算", "2:乗算", "3:除算"], dependsOn: { idx: 3, val: ["4"] } },
        idx6: { name: "値レベル", type: "number" },
        idx7: { name: "発動確率(0~100)", type: "number", min: 0, max: 100 },
        idx8: { name: "発動条件", options: ["0:メーター満タン時", "1:永続", "2:HPに応じる"] },
        idx9: { name: "HP取得対象", options: ["0:自分", "1:相手"], dependsOn: { idx: 8, val: ["2"] } },
        idx10: { name: "HP残率指定", type: "number", min: 0, max: 100, dependsOn: { idx: 8, val: ["2"] } },
        idx11: { name: "継続ターン数", type: "custom_turn" }
      },
      4: {
        idx1: { name: "対象", options: ["0:自分", "1:相手"] },
        idx2: { name: "メニュー", options: ["0:ステータス参照", "1:場所", "2:相手のID"] },
        idx3: { name: "対象ステータス", options: ["0:体力", "1:パワー", "2:ガード", "3:コミュ力", "4:学力", "5:IQ", "6:合計"], dependsOn: { idx: 2, val: ["0"] } },
        idx4: { name: "条件設定数値", type: "custom_num", options: ["0:自分の数値", "custom:カスタム数値"], dependsOn: { idx: 2, val: ["0"] } },
        idx5: { name: "条件", options: ["0:以上", "1:以下", "2:超過", "3:未満", "4:等しい"], dependsOn: { idx: 2, val: ["0"] } },
        idx6: { name: "リスト", type: "list_text", dependsOn: { idx: 2, val: ["1", "2"] } },
        idx7: { name: "条件", options: ["0:リストに含まれる", "1:リストに含まれない"], dependsOn: { idx: 2, val: ["1", "2"] } },
        idx8: { name: "発動フラグ", options: ["0:trueの場合のみそれ以下を発動"] },
        idx9: { name: "未使用(0埋め)", type: "fixed_zero" },
        idx10: { name: "未使用(0埋め)", type: "fixed_zero" },
        idx11: { name: "未使用(0埋め)", type: "fixed_zero" }
      }
    };

    function renderForm() {
      const type = document.getElementById('type').value;
      const container = document.getElementById('form-fields');
      container.innerHTML = '';

      const currentSpec = specData[type];

      for (let i = 1; i <= 11; i++) {
        const item = currentSpec[`idx${i}`];
        if (!item) continue;

        const fieldDiv = document.createElement('div');
        fieldDiv.className = 'field';
        fieldDiv.id = `field-idx${i}`;

        const label = document.createElement('label');
        label.htmlFor = `input-idx${i}`;
        const ix = document.createElement('span');
        ix.className = 'ix';
        ix.textContent = `idx${i}`;
        label.appendChild(ix);
        label.appendChild(document.createTextNode(item.name));
        fieldDiv.appendChild(label);

        if (item.options && item.type !== 'custom_num') {
          const select = document.createElement('select');
          select.id = `input-idx${i}`;
          select.onchange = () => { handleInputChange(type); generateAll(); };

          item.options.forEach(opt => {
            const el = document.createElement('option');
            const val = opt.split(':')[0];
            el.value = val;
            el.textContent = opt;
            select.appendChild(el);
          });

          fieldDiv.appendChild(select);
        } else if (item.type === 'custom_num') { // 修正点: カスタム数値対応
          const select = document.createElement('select');
          select.id = `input-idx${i}`;
          item.options.forEach(opt => {
            const el = document.createElement('option');
            const val = opt.split(':')[0];
            el.value = val;
            el.textContent = (val === 'custom') ? '1以上:カスタム数値' : opt;
            select.appendChild(el);
          });
          select.onchange = function() {
            const numInput = document.getElementById(`input-idx${i}-custom`);
            numInput.style.display = (this.value === 'custom') ? 'inline-block' : 'none';
            generateAll();
          };
          fieldDiv.appendChild(select);

          const numInput = document.createElement('input');
          numInput.type = 'number';
          numInput.id = `input-idx${i}-custom`;
          numInput.value = 1;
          numInput.min = 1;
          numInput.style.display = 'none';
          numInput.className = 'custom-num';
          numInput.oninput = () => generateAll();
          fieldDiv.appendChild(numInput);
        } else if (item.type === 'number') {
          const input = document.createElement('input');
          input.type = 'number';
          input.id = `input-idx${i}`;
          input.value = (i === 7) ? 100 : 0;
          if (item.min !== undefined) input.min = item.min;
          if (item.max !== undefined) input.max = item.max;
          input.oninput = () => generateAll();
          fieldDiv.appendChild(input);
        } else if (item.type === 'list_text') {
          const input = document.createElement('input');
          input.type = 'text';
          input.id = `input-idx${i}`;
          input.placeholder = "例: 1,2,3";
          input.oninput = () => generateAll();
          fieldDiv.appendChild(input);
        } else if (item.type === 'custom_turn') {
          const select = document.createElement('select');
          select.id = `input-idx${i}`;
          select.add(new Option('0:永続', '0'));
          select.add(new Option('1以上:カスタム数値', 'custom'));
          select.onchange = function() {
            const numInput = document.getElementById(`input-idx${i}-custom`);
            numInput.style.display = (this.value === 'custom') ? 'inline-block' : 'none';
            generateAll();
          };
          fieldDiv.appendChild(select);

          const numInput = document.createElement('input');
          numInput.type = 'number';
          numInput.id = `input-idx${i}-custom`;
          numInput.value = 1;
          numInput.min = 1;
          numInput.style.display = 'none';
          numInput.className = 'custom-num';
          numInput.oninput = () => generateAll();
          fieldDiv.appendChild(numInput);
        } else if (item.type === 'fixed_zero') {
          const input = document.createElement('input');
          input.type = 'text';
          input.id = `input-idx${i}`;
          input.value = '0';
          input.disabled = true;
          fieldDiv.appendChild(input);
        }

        container.appendChild(fieldDiv);
      }

      handleInputChange(type);
      generateAll();
    }

    function handleInputChange(type) {
      const currentSpec = specData[type];

      for (let i = 1; i <= 11; i++) {
        const item = currentSpec[`idx${i}`];
        const fieldDiv = document.getElementById(`field-idx${i}`);
        if (!item || !fieldDiv) continue;

        if (item.dependsOn) {
          const targetElem = document.getElementById(`input-idx${item.dependsOn.idx}`);
          if (targetElem && item.dependsOn.val.includes(targetElem.value)) {
            fieldDiv.style.display = '';
          } else {
            fieldDiv.style.display = 'none';
          }
        } else {
          fieldDiv.style.display = '';
        }

      }
    }

    function getCommandArray() {
      const type = document.getElementById('type').value;
      const resultArray = [type];

      for (let i = 1; i <= 11; i++) {
        const item = specData[type][`idx${i}`];
        let val = "0";

        if (item.type === 'list_text') {
          const elem = document.getElementById(`input-idx${i}`);
          const raw = elem ? elem.value.trim() : '';
          val = raw ? `(${raw})` : '()';
        } else if (item.type === 'custom_turn' || item.type === 'custom_num') { // 修正点: custom_num の値取得を追加
          const sel = document.getElementById(`input-idx${i}`).value;
          if (sel === 'custom') {
            val = document.getElementById(`input-idx${i}-custom`).value || '1';
          } else {
            val = sel;
          }
        } else {
          const elem = document.getElementById(`input-idx${i}`);
          if (elem) {
            val = elem.value;
          }
        }
        resultArray.push(val);
      }
      return resultArray;
    }

    function generateAll() {
      const arr = getCommandArray();
      document.getElementById('output').textContent = `[${arr.join(' ')}]`;
      document.getElementById('description').textContent = buildDescription(arr);
    }

    function buildDescription(arr) {
      const type = arr[0];
      const targetMap = { '0': '自分', '1': '相手', '2': '両方' };
      
      const prob = arr[7];
      const condVal = arr[8];
      const turnVal = arr[11];
      
      let suffixStr = "";
      if (condVal === '1') {
        suffixStr = `常に${prob}%の確率で発動。`;
      } else if (condVal === '2') {
        const who = (arr[9] === '1') ? '相手' : '自分';
        suffixStr = `${who}のHPが${arr[10]}%以下のとき、毎ターン${prob}%の確率で発動。`;
      } else {
        const condMap = { '0': 'メーター満タン時' };
        const condText = condMap[condVal] || '';
        const turnText = (turnVal === '0') ? '永続的に' : `${turnVal}ターン分`;
        suffixStr = `${condText}に${prob}%の確率で${turnText}発動。`;
      }

      if (type === '1') {
        const target = targetMap[arr[1]] || '';
        const statMap = { '0': '体力', '1': 'パワー', '2': 'ガード', '3': 'コミュ力', '4': '学力', '5': 'IQ', '6': '全ステータス' };
        const stat = statMap[arr[2]] || '';
        
        let mainEffect = "";
        if (arr[3] === '4') {
          const refStatMap = { '0': '体力', '1': 'パワー', '2': 'ガード', '3': 'コミュ力', '4': '学力', '5': 'IQ', '6': '前ターンのダメージ量' };
          const refStat = refStatMap[arr[4]] || '相手のステータス';
          const val = arr[6];
          const calcMethod = arr[5];

          let formulaStr = "";
          if (calcMethod === '0') formulaStr = `相手の${refStat} + ${val}`;
          else if (calcMethod === '1') formulaStr = `相手の${refStat} - ${val}`;
          else if (calcMethod === '2') formulaStr = `相手の${refStat} × ${val}`;
          else if (calcMethod === '3') formulaStr = `相手の${refStat} ÷ ${val}`;

          mainEffect = `${target}の${stat}を (${formulaStr}) にする`;
        } else {
          const calcMap = { '0': `を ${arr[6]} 加算する`, '1': `を ${arr[6]} 減算する`, '2': `を ${arr[6]} 倍にする`, '3': `を ${arr[6]} で割る` };
          mainEffect = `${target}の${stat}${calcMap[arr[3]] || ''}`;
        }

        return `${mainEffect}。${suffixStr}`;
      } 
      else if (type === '2') {
        const target = (arr[1] === '0') ? '自分' : '相手';
        let mainEffect = "";
        
        if (arr[3] === '0') {
          mainEffect = `${target}に ${arr[6]}（固定値）のダメージを与える`;
        } else if (arr[3] === '1') {
          mainEffect = `${target}に（パワーステータス × ${arr[6]}）のダメージを与える`;
        } else if (arr[3] === '2') {
          const refStatMap = { '0': '最大体力', '1': 'パワー', '2': 'ガード', '3': 'コミュ力', '4': '学力', '5': 'IQ', '6': '前ターンのダメージ量', '7': '実行時の体力' };
          const refStat = refStatMap[arr[4]] || '相手のステータス';
          const val = arr[6];
          const calcMethod = arr[5];

          let formulaStr = "";
          if (calcMethod === '0') formulaStr = `相手の${refStat} + ${val}`;
          else if (calcMethod === '1') formulaStr = `相手の${refStat} - ${val}`;
          else if (calcMethod === '2') formulaStr = `相手の${refStat} × ${val}`;
          else if (calcMethod === '3') formulaStr = `相手の${refStat} ÷ ${val}`;

          mainEffect = `(${formulaStr}) のダメージを${target}に与える`;
        }

        return `${mainEffect}。${suffixStr}`;
      } 
      else if (type === '3') {
        const target = targetMap[arr[1]] || '';
        const sysMap = { '0': '防御力', '1': 'クリティカル率', '2': 'ミス率', '3': 'クリティカル倍率', '4': '実行時の体力' };
        const sysIndex = arr[2];
        const sysName = sysMap[sysIndex] || '';
        const isPercentTarget = ['0', '1', '2', '3'].includes(sysIndex);
        
        let mainEffect = "";
        if (arr[3] === '4') {
          const refStatMap = { '0': '最大体力', '1': 'パワー', '2': 'ガード', '3': 'コミュ力', '4': '学力', '5': 'IQ', '6': '前ターンのダメージ量', '7': '実行時の体力' };
          const refStat = refStatMap[arr[4]] || '相手のステータス';
          const val = arr[6];
          const calcMethod = arr[5];

          let formulaStr = "";
          if (calcMethod === '0') formulaStr = `相手の${refStat} + ${val}`;
          else if (calcMethod === '1') formulaStr = `相手の${refStat} - ${val}`;
          else if (calcMethod === '2') formulaStr = `相手の${refStat} × ${val}`;
          else if (calcMethod === '3') formulaStr = `相手の${refStat} ÷ ${val}`;

          mainEffect = `${target}の${sysName}を (${formulaStr}) にする`;
        } else {
          if (isPercentTarget && arr[3] === '0') {
            mainEffect = `${target}の${sysName}を ${arr[6]}%にする`;
          } else if (isPercentTarget && arr[3] === '1') {
            mainEffect = `${target}の${sysName}を ${arr[6]}%減少させる`;
          } else {
            const calcMap = { '0': `に ${arr[6]} 加算する`, '1': `から ${arr[6]} 減算する`, '2': `を ${arr[6]} 倍にする`, '3': `を ${arr[6]} で割る` };
            mainEffect = `${target}の${sysName}${calcMap[arr[3]] || ''}`;
          }
        }

        return `${mainEffect}。${suffixStr}`;
      } 
      else if (type === '4') {
        const target = targetMap[arr[1]] || '';
        const menu = arr[2];

        if (menu === '0') {
          const statMap = { '0': '体力', '1': 'パワー', '2': 'ガード', '3': 'コミュ力', '4': '学力', '5': 'IQ', '6': '全ステータス合計' };
          const condCompMap = { '0': '以上', '1': '以下', '2': '超過', '3': '未満', '4': '等しい' };
          
          // 修正点: 種別4-idx4でカスタム数値が選ばれている場合の文章生成
          const valText = (arr[4] === '0') ? '自分の数値' : `カスタム数値(${arr[4]})`;
          return `【条件判定】${target}の${statMap[arr[3]] || ''}が${valText} ${condCompMap[arr[5]] || ''} の場合、以降のコマンドを実行する。`;
        } else if (menu === '1') {
          const inMap = { '0': '含まれる', '1': '含まれない' };
          return `【条件判定】現在の場所が リスト${arr[6]} に${inMap[arr[7]] || ''}場合、以降のコマンドを実行する。`;
        } else if (menu === '2') {
          const inMap = { '0': '含まれる', '1': '含まれない' };
          return `【条件判定】相手のIDが リスト${arr[6]} に${inMap[arr[7]] || ''}場合、以降のコマンドを実行する。`;
        }
      }

      return "説明文を生成できませんでした。";
    }

    function showCopied() {
      const msg = document.getElementById('copy-msg');
      msg.classList.add('show');
      clearTimeout(showCopied.t);
      showCopied.t = setTimeout(() => msg.classList.remove('show'), 2000);
    }

    function copyToClipboard() {
      const outputText = document.getElementById('output').textContent;
      const fallback = () => {
        const ta = document.createElement('textarea');
        ta.value = outputText;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try { if (document.execCommand('copy')) showCopied(); } catch (e) {}
        document.body.removeChild(ta);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(outputText).then(showCopied, fallback);
      } else {
        fallback();
      }
    }

    renderForm();
</script>
</body></html>
